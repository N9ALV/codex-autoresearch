name: Validate research files

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate lightweight research invariants
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const p = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(p) : [p];
            });
          }
          const files = walk('.').filter((p) => !p.includes('/.git/'));
          const tooLarge = files.filter((p) => fs.statSync(p).size > 10 * 1024 * 1024);
          if (tooLarge.length) {
            console.error('Large files should use object storage/manifests, not Git:', tooLarge);
            process.exit(1);
          }
          const scenarioFiles = files.filter((p) => /scenarios\.ya?ml$/.test(p));
          for (const file of scenarioFiles) {
            const text = fs.readFileSync(file, 'utf8');
            const weights = [...text.matchAll(/^\s*weight:\s*([0-9.]+)/gm)].map((m) => Number(m[1]));
            if (weights.length && Math.abs(weights.reduce((a, b) => a + b, 0) - 1) > 0.001) {
              console.error(`${file}: scenario weights must sum to 1.0`);
              process.exit(1);
            }
          }
          console.log(`Validated ${files.length} files.`);
          NODE
